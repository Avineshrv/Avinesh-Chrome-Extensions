<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful! - Mobile Simulator Premium</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #fcfcf9;
      --text-color: #1a1a1a;
      --success-color: #70c050;
      --primary-color: #000000;
      --border-color: #eaeae0;
      --card-bg: #ffffff;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .success-container {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      box-shadow: 0 40px 80px -15px rgba(0, 0, 0, 0.05), 0 0 1px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 550px;
      padding: 44px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .success-icon-wrapper {
      width: 80px;
      height: 80px;
      background-color: rgba(112, 192, 80, 0.1);
      color: var(--success-color);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
      animation: scaleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes scaleIn {
      from { transform: scale(0.6); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .title {
      font-size: 24px;
      font-weight: 800;
      color: var(--primary-color);
      margin-bottom: 12px;
    }

    .desc {
      font-size: 14.5px;
      line-height: 1.6;
      color: #555555;
      margin-bottom: 30px;
      max-width: 400px;
    }

    .license-box {
      width: 100%;
      background-color: #f7f7f0;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      text-align: left;
      display: none;
    }

    .license-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.5px;
      font-weight: 700;
      color: #666666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .btn-copy {
      background: none;
      border: none;
      color: var(--success-color);
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      transition: opacity 0.15s;
    }

    .btn-copy:hover {
      opacity: 0.8;
    }

    .license-textarea {
      width: 100%;
      height: 80px;
      border: 1px dashed var(--border-color);
      background-color: #ffffff;
      border-radius: 6px;
      padding: 10px;
      font-family: monospace;
      font-size: 11px;
      color: #555555;
      resize: none;
      outline: none;
      word-break: break-all;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: #daf5d5;
      color: #24571c;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .spinner {
      border: 2px solid rgba(0, 0, 0, 0.1);
      border-radius: 50%;
      border-top: 2px solid var(--success-color);
      width: 16px;
      height: 16px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 14px;
      color: #555555;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div class="success-container">
    <div class="success-icon-wrapper">
      <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    
    <h1 class="title">Upgrade Complete!</h1>
    
    <div class="loading-text" id="status-loading">
      <span class="spinner"></span>
      Generating your secure license key...
    </div>

    <div class="status-badge" id="status-unlocked" style="display: none;">
      Premium Successfully Activated
    </div>

    <p class="desc" id="success-desc">
      Thank you for your purchase! We are communicating with your Mobile Viewport Simulator extension to automatically activate your lifetime access.
    </p>

    <!-- License display box (fallback) -->
    <div class="license-box" id="license-box">
      <div class="license-header">
        License Key (Offline Backup)
        <button class="btn-copy" onclick="copyLicense()" id="btn-copy">Copy Key</button>
      </div>
      <textarea id="license-key-area" class="license-textarea" readonly></textarea>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('session_id');
    
    let generatedLicense = null;

    async function fetchLicense() {
      if (!sessionId) {
        document.getElementById('status-loading').innerHTML = '⚠️ Invalid checkout session ID.';
        return;
      }

      try {
        const response = await fetch(`/verify-checkout?session_id=${sessionId}`);
        const data = await response.json();
        
        if (data.success && data.license) {
          generatedLicense = JSON.stringify(data.license);
          
          document.getElementById('license-key-area').value = generatedLicense;
          document.getElementById('license-box').style.display = 'block';
          
          document.getElementById('status-loading').style.display = 'none';
          document.getElementById('status-unlocked').style.display = 'inline-flex';
          document.getElementById('success-desc').innerHTML = 
            "Premium features have been unlocked! The side panel extension has been notified. You can close this tab and start using all the pro devices and orientations.";

          deliverLicenseToExtension(data.license);
        } else {
          document.getElementById('status-loading').innerHTML = '⚠️ Payment verification pending. Please refresh.';
        }
      } catch (err) {
        document.getElementById('status-loading').innerHTML = '⚠️ Error verifying checkout: ' + err.message;
      }
    }

    function deliverLicenseToExtension(licenseObj) {
      window.postMessage({
        type: 'MOBILE_EMULATOR_PAYMENT_SUCCESS',
        license: licenseObj
      }, '*');

      if (window.chrome && chrome.runtime && chrome.runtime.sendMessage) {
        chrome.runtime.sendMessage({
          type: 'PAYMENT_COMPLETED',
          license: licenseObj
        }, (response) => {
          console.log('[Success page] Extension active notification response:', response);
        });
      }
      
      localStorage.setItem('mobile_emulator_active_license', JSON.stringify(licenseObj));
    }

    function copyLicense() {
      const copyText = document.getElementById("license-key-area");
      copyText.select();
      copyText.setSelectionRange(0, 99999);
      navigator.clipboard.writeText(copyText.value);
      
      const copyBtn = document.getElementById("btn-copy");
      copyBtn.textContent = "Copied!";
      setTimeout(() => {
        copyBtn.textContent = "Copy Key";
      }, 2000);
    }

    fetchLicense();
  </script>
</body>
</html>
